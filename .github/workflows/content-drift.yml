name: Content drift

on:
  # Daily: regenerate from the endpoint. Files a draft PR when the package is behind,
  # or an issue when the only change needs a hand-written key. Exits green when the
  # endpoint has nothing new.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show the diff without opening a PR
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  # The issue fallback, for when a hand-written entry is all that changed.
  issues: write

concurrency:
  group: content-drift

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.3.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - run: |
          git config user.name "Not-Jayden"
          git config user.email "16816250+Not-Jayden@users.noreply.github.com"
          node scripts/codegen-content-pr.mjs ${{ inputs.dry_run && '--dry' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
